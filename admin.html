<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · St. John's Cathedral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin" class="hide-tbd">


<main>
<section class="view" data-view="admin"><div class="gut"><div class="col stack">
  <div class="sec-head"><div><div class="eyebrow">Staff only</div><h1>Cathedral dashboard</h1></div><p class="muted small">Signed in as Parish Office <span class="sample">Sample</span></p></div>
  <div class="admin-wrap">
    <div class="side" id="adminSide">
      <button type="button" data-tab="bookings" class="on">Bookings</button>
      <button type="button" data-tab="tours">Tours &amp; prices</button>
      <button type="button" data-tab="content">Website content</button>
      <button type="button" data-tab="reports">Reports</button>
    </div>
    <div id="adminBody" class="stack" style="min-width:0"></div>
  </div>
</div></div></section>
</main>



<div class="proto-pill" id="protoPill">
  <button type="button" id="protoToggle" aria-expanded="false" aria-controls="protoMenu">Prototype</button>
  <div class="proto-menu" id="protoMenu" hidden>
    <p class="muted small">Sample data. Nothing is booked or sent.</p>
    <div class="pm-links modes">
      <a href="index.html" data-mode="site">Website</a>
      <a href="admin.html" data-mode="admin">Admin dashboard</a>
      <a href="scanner.html" data-mode="scanner">Guide scanner</a>
    </div>
    <button type="button" id="qBtn">Open questions</button>
    <button type="button" id="tbdBtn" aria-pressed="false">Show labels</button>
    <button type="button" id="resetBtn">Reset sample data</button>
  </div>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Open questions">
  <div class="sec-head"><h2>Open questions</h2><button type="button" class="ghost" id="qClose">Close</button></div>
  <p class="muted small">Still to confirm with the church. Each one appears in the prototype with a <span class="tbd" style="margin:0">TBD</span> label.</p>
  <ol id="qList"></ol>
</aside>
<div class="toast" id="toast" hidden role="status"></div>
<script src="app.js"></script>
</body>
</html>
